<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BluePeak Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>BluePeak Counter</h1>
    <p class="subtitle">Increment / Decrement — persisted in RDS PostgreSQL</p>
    <div class="count" id="count">0</div>
    <div class="buttons">
      <button id="decrement">-</button>
      <button id="increment">+</button>
    </div>
    <p class="footer" id="status">loading...</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
